<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>
<body>
  <form action="https://www.example.com/submit" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required><br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter your age" required><br><br>

    <label for="bday">Birthday:</label>
    <input type="date" id="bday" name="bday" required><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message" required></textarea><br><br>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label> 
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label> 
    <input type="radio" id="other" name="gender" value="other" required>
    <label for="other">Other</label> <br><br>

    <label for="payment">Payment bank:</label>
    <select id="payment" name="payment" required>
      <option value="">Select your payment bank</option>
      <option value="visa">Visa</option>
      <option value="hdfc">HDFC</option>
      <option value="icici">ICICI</option>
      <option value="idfc">IDFC</option>
      <option value="sbi">SBI</option>
    </select><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
